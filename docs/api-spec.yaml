openapi: "3.0.3"
info:
  title: "AgentX Platform API"
  description: "AgentX 电商 AI 工作助手 API 接口定义"
  version: "1.0.0"
  contact:
    name: "AgentX Team"

servers:
  - url: "http://localhost:8000"
    description: "本地开发环境"
  - url: "https://api.agentx.example.com"
    description: "生产环境"

tags:
  - name: "auth"
    description: "用户认证"
  - name: "chat"
    description: "核心聊天（SSE 流式）"
  - name: "conversations"
    description: "对话管理"
  - name: "kol"
    description: "达人搜索与管理"
  - name: "review"
    description: "审核确认"
  - name: "knowledge"
    description: "知识库管理"
  - name: "admin"
    description: "管理接口"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---- 通用 ----
    Error:
      type: object
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
        status_code:
          type: integer
        timestamp:
          type: string
          format: date-time

    # ---- 认证 ----
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          example: "zhangsan"
        password:
          type: string
          minLength: 8
          example: "password123"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: "JWT access token, 30 分钟过期"
        refresh_token:
          type: string
          description: "刷新令牌, 7 天过期"
        token_type:
          type: string
          example: "bearer"

    RegisterRequest:
      type: object
      required: [username, password, company_name, brand_name, category]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
        email:
          type: string
          format: email
        company_name:
          type: string
          maxLength: 100
        brand_name:
          type: string
          maxLength: 100
        category:
          type: string
          maxLength: 50
          description: "行业分类"

    UserInfo:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        company_id:
          type: integer
        company_name:
          type: string
        is_admin:
          type: boolean

    # ---- 聊天 ----
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 10000
          description: "用户消息"
          example: "帮我找美妆达人"
        company_id:
          type: string
          description: "公司 ID（租户隔离）"
        agent_name:
          type: string
          description: "指定 Agent 名称（可选，不指定时 Master 自动路由）"
        session_id:
          type: string
          description: "会话 ID（多轮对话上下文追踪）"
        mode:
          type: string
          enum: [workflow, agent, engine_first, hybrid]
          description: "工作模式（可选，默认 LLM 自动判断）"

    # ---- SSE 事件类型 ----
    SSEEvent:
      type: object
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          enum:
            - thinking
            - intent
            - plan
            - sources
            - tool_result
            - content
            - reflection
            - retry
            - done
            - error

    ThinkingEvent:
      allOf:
        - $ref: "#/components/schemas/SSEEvent"
        - type: object
          properties:
            content:
              type: string
              example: "AI is planning..."

    IntentEvent:
      allOf:
        - $ref: "#/components/schemas/SSEEvent"
        - type: object
          properties:
            intent_type:
              type: string
              example: "kol_search"
            confidence:
              type: number
              example: 0.95

    PlanEvent:
      allOf:
        - $ref: "#/components/schemas/SSEEvent"
        - type: object
          properties:
            content:
              type: string
              description: "任务摘要"
            steps:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  description:
                    type: string
                  tool:
                    type: string

    SourcesEvent:
      allOf:
        - $ref: "#/components/schemas/SSEEvent"
        - type: object
          properties:
            references:
              type: array
              items:
                type: object
                properties:
                  source_file:
                    type: string
                  source_page:
                    type: integer
                  score:
                    type: number
                  content:
                    type: string

    ToolResultEvent:
      allOf:
        - $ref: "#/components/schemas/SSEEvent"
        - type: object
          properties:
            tool:
              type: string
              example: "search_kols"
            result:
              type: string

    ContentEvent:
      allOf:
        - $ref: "#/components/schemas/SSEEvent"
        - type: object
          properties:
            content:
              type: string
              description: "增量文本内容"

    ReflectionEvent:
      allOf:
        - $ref: "#/components/schemas/SSEEvent"
        - type: object
          properties:
            passed:
              type: boolean
            issues:
              type: array
              items:
                type: string

    DoneEvent:
      allOf:
        - $ref: "#/components/schemas/SSEEvent"
        - type: object
          properties: {}

    # ---- 对话管理 ----
    Conversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          description: "对话标题（自动生成或用户设置）"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        message_count:
          type: integer
        last_message:
          type: string
          description: "最后一条消息摘要"

    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"

    Message:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, master, system]
        content:
          type: string
        content_type:
          type: string
          enum: [text, kol_list, analysis_report, script, logistics, plan]
        metadata:
          type: object
          description: "结构化元数据（达人列表 JSON、报告数据等）"
        references:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        created_at:
          type: string
          format: date-time

    Reference:
      type: object
      properties:
        source_file:
          type: string
        source_page:
          type: integer
        score:
          type: number
        content:
          type: string

    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200

    # ---- 达人 ----
    KolProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "李佳琦Austin"
        platform:
          type: string
          enum: [douyin, xiaohongshu, kuaishou, bilibili, weibo]
        followers:
          type: integer
          description: "粉丝数"
          example: 48500000
        engagement_rate:
          type: number
          description: "互动率 (百分比)"
          example: 3.5
        category:
          type: string
          example: "美妆"
        avg_views:
          type: integer
          description: "平均播放量"
        avg_likes:
          type: integer
          description: "平均点赞数"
        avg_comments:
          type: integer
          description: "平均评论数"
        price_range:
          type: string
          description: "报价区间"
          example: "8000-15000"
        location:
          type: string
          description: "所在地"
        verified:
          type: boolean
        bio:
          type: string
          description: "个人简介"
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time

    KolSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          example: "美妆达人"
        platform:
          type: string
          enum: [douyin, xiaohongshu, kuaishou, bilibili, weibo, all]
          default: all
        category:
          type: string
        min_followers:
          type: integer
          default: 0
        max_followers:
          type: integer
        min_engagement_rate:
          type: number
          default: 0
        sort_by:
          type: string
          enum: [followers, engagement_rate, relevance]
          default: relevance
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20

    KolSearchResponse:
      type: object
      properties:
        total:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/KolProfile"
        search_id:
          type: string
          description: "搜索 ID，用于后续追问"

    KolExportRequest:
      type: object
      properties:
        kol_ids:
          type: array
          items:
            type: integer
        format:
          type: string
          enum: [csv, pdf]
          default: csv

    # ---- 审核 ----
    ReviewAction:
      type: object
      properties:
        comment:
          type: string
          description: "审核意见（驳回时必填）"
          maxLength: 500

    # ---- 知识库 ----
    KnowledgeDocument:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        file_type:
          type: string
          enum: [pdf, docx, html, txt, md]
        file_size:
          type: integer
          description: "文件大小 (bytes)"
        chunk_count:
          type: integer
        status:
          type: string
          enum: [processing, ready, failed]
        created_at:
          type: string
          format: date-time

    # ---- 健康检查 ----
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        service:
          type: string
        version:
          type: string
        checks:
          type: object
          properties:
            database:
              type: string
            redis:
              type: string
            milvus:
              type: string
            task_worker:
              type: string
        database_type:
          type: string

security:
  - BearerAuth: []

paths:
  # ============================================================
  # 认证
  # ============================================================
  /api/auth/token:
    post:
      tags: [auth]
      summary: "用户登录"
      description: "使用用户名密码登录，返回 JWT access_token 和 refresh_token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "登录成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "用户名或密码错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/users/register:
    post:
      tags: [auth]
      summary: "用户注册"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "注册成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "400":
          description: "用户名已存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "参数校验失败"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/token/refresh:
    post:
      tags: [auth]
      summary: "刷新 Token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: "刷新成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /api/auth/me:
    get:
      tags: [auth]
      summary: "获取当前用户信息"
      responses:
        "200":
          description: "用户信息"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"

  # ============================================================
  # 核心聊天
  # ============================================================
  /api/chat:
    post:
      tags: [chat]
      summary: "流式聊天（SSE）"
      description: |
        核心聊天接口，使用 Server-Sent Events (SSE) 实现流式响应。

        SSE 事件类型:
        - `thinking`: AI 正在思考
        - `intent`: 意图识别结果
        - `plan`: 执行计划
        - `sources`: RAG 引用来源
        - `tool_result`: 工具执行结果
        - `content`: 增量文本内容
        - `reflection`: 质量审查结果
        - `retry`: 重试状态
        - `done`: 对话完成
        - `error`: 错误信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: "SSE 事件流"
          content:
            text/plain:
              schema:
                type: string
                description: "SSE 格式事件流"
        "401":
          description: "未登录"

  /api/chat/health:
    get:
      tags: [chat]
      summary: "聊天服务健康检查"
      security: []
      responses:
        "200":
          description: "健康状态"

  # ============================================================
  # 对话管理
  # ============================================================
  /api/conversations:
    get:
      tags: [conversations]
      summary: "获取对话列表"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "对话列表"
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"

    post:
      tags: [conversations]
      summary: "创建新对话"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: "创建成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /api/conversations/{conversation_id}:
    get:
      tags: [conversations]
      summary: "获取对话详情（含消息列表）"
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "对话详情"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: "对话不存在"

    delete:
      tags: [conversations]
      summary: "删除对话"
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: "删除成功"
        "404":
          description: "对话不存在"

  # ============================================================
  # 达人搜索
  # ============================================================
  /api/kol/search:
    post:
      tags: [kol]
      summary: "达人搜索"
      description: "搜索达人，支持多平台、多条件筛选"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KolSearchRequest"
      responses:
        "200":
          description: "搜索结果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KolSearchResponse"

  /api/kol/{kol_id}:
    get:
      tags: [kol]
      summary: "达人详情"
      parameters:
        - name: kol_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "达人详情"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KolProfile"
        "404":
          description: "达人不存在"

  /api/kol/export:
    post:
      tags: [kol]
      summary: "导出达人列表"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KolExportRequest"
      responses:
        "200":
          description: "导出文件"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ============================================================
  # 审核确认
  # ============================================================
  /api/review/{content_id}/approve:
    post:
      tags: [review]
      summary: "审核通过"
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "审核通过"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "approved"

  /api/review/{content_id}/reject:
    post:
      tags: [review]
      summary: "审核驳回"
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAction"
      responses:
        "200":
          description: "审核驳回"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "rejected"

  # ============================================================
  # 知识库
  # ============================================================
  /api/knowledge/upload:
    post:
      tags: [knowledge]
      summary: "上传文档到知识库"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "支持 PDF / DOCX / HTML / TXT / MD"
      responses:
        "201":
          description: "上传成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          description: "文件格式不支持"

  /api/knowledge/documents:
    get:
      tags: [knowledge]
      summary: "获取知识库文档列表"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "文档列表"
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeDocument"

  /api/knowledge/documents/{document_id}:
    delete:
      tags: [knowledge]
      summary: "删除知识库文档"
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: "删除成功"

  # ============================================================
  # 健康检查
  # ============================================================
  /health:
    get:
      tags: [admin]
      summary: "系统健康检查"
      security: []
      responses:
        "200":
          description: "健康状态"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"