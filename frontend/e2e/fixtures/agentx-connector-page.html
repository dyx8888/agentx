<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AgentX Connector E2E Fixture</title>
  </head>
  <body>
    <main>
      <h1>AgentX Connector E2E Fixture</h1>
    </main>
    <script>
      function waitForConnectorInjected() {
        return new Promise((resolve, reject) => {
          const startedAt = Date.now();
          const timer = setInterval(() => {
            if (window.__AGENTX_CONNECTOR_INJECTED__) {
              clearInterval(timer);
              resolve();
              return;
            }
            if (Date.now() - startedAt > 5000) {
              clearInterval(timer);
              reject(new Error("connector injected marker not found"));
            }
          }, 50);
        });
      }

      async function runAllowlistedFetch() {
        const response = await fetch(
          "/square_pc_api/square/search_feed_author",
          {
            headers: {
              Authorization: "Bearer should-not-be-collected"
            }
          }
        );
        await response.json();
      }

      async function runAllowlistedPostWithBody() {
        const response = await fetch("/apply_sample_pc_api/sample/apply", {
          method: "POST",
          headers: {
            Authorization: "Bearer post-authorization-should-not-be-collected",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            request_body_secret: "request-body-should-not-be-collected"
          })
        });
        await response.json();
      }

      function runAllowlistedXhr() {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", "/creative_radar_api/radar/list");
          xhr.setRequestHeader("Authorization", "Bearer xhr-should-not-be-collected");
          xhr.onload = () => resolve();
          xhr.onerror = () => reject(new Error("xhr failed"));
          xhr.send();
        });
      }

      async function runBlockedFetch() {
        const response = await fetch("/public/not-allowlisted?token=should-not-leak");
        await response.json();
      }

      document.cookie = "platform_session=platform-cookie-should-not-be-collected; path=/";

      waitForConnectorInjected()
        .then(() => Promise.all([
          runAllowlistedFetch(),
          runAllowlistedPostWithBody(),
          runAllowlistedXhr(),
          runBlockedFetch()
        ]))
        .then(() => {
          document.body.dataset.agentxFixtureDone = "true";
        })
        .catch((error) => {
          document.body.dataset.agentxFixtureError = String(error && error.message ? error.message : error);
        });
    </script>
  </body>
</html>
