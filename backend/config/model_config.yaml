default_model: deepseek

models:
  deepseek:
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    model_name: deepseek-chat
    temperature: 0.7
    max_tokens: 2048
    fallback_models:
      - deepseek_volc
    cost_per_1k_input_tokens: 0.00014   # DeepSeek input price
    cost_per_1k_output_tokens: 0.00028  # DeepSeek output price
  deepseek_volc:
    provider: volcano
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: deepseek-chat
    temperature: 0.7
    max_tokens: 2048
    cost_per_1k_input_tokens: 0.00014
    cost_per_1k_output_tokens: 0.00028
  gpt4o:
    provider: openai
    model_name: gpt-4o
    fallback_models: []
    cost_per_1k_input_tokens: 0.005
    cost_per_1k_output_tokens: 0.015
