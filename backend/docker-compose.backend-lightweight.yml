# Public-demo backend lightweight compose file.
# Use only after explicit authorization for a backend startup smoke.
# This file intentionally defines only the backend main service, does not mount
# any env files, and reuses the already-local agentx-backend:latest image.
# It can only prove the local backend image smoke; it does not prove that the
# image was built from the current public-demo HEAD.
# Future startup must use --no-build --pull never so missing images fail closed.
name: agentx-public-demo-backend-lightweight

services:
  main:
    image: agentx-backend:latest
    container_name: agentx-lightweight-backend
    ports:
      - "8000:8000"
    environment:
      ENV: dev
      ENVIRONMENT: development
      DATABASE_URL: postgresql://agentx:change-me-local-only@agentx-lightweight-postgres:5432/agentx
      REDIS_URL: redis://agentx-lightweight-redis:6379/0
      RATE_LIMIT_REDIS_URL: redis://agentx-lightweight-redis:6379/1
      ENABLE_EVOLUTION_API: "false"
      ENABLE_PUBLIC_DOCS: "false"
      AGENT_EVAL_MODE: "1"
      AGENTX_BACKEND_LIGHTWEIGHT_SMOKE: "1"
      TOOL_DESCRIPTION_AUTO_ENHANCE: "0"
      TOOL_LOAD_MODE: local
      MILVUS_HOST: 127.0.0.1
      MILVUS_PORT: "19530"
    networks:
      - public-demo-lightweight-network
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  public-demo-lightweight-network:
    name: agentx-public-demo-lightweight-network
    external: true
