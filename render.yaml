services:
  - type: web
    name: agentx-backend-public-demo
    runtime: python
    rootDir: .
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENV
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_PUBLIC_DOCS
        value: "false"
      - key: ENABLE_EVOLUTION_API
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: MILVUS_HOST
        sync: false
      - key: MILVUS_PORT
        value: "19530"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OAUTH_REDIRECT_BASE_URL
        sync: false
