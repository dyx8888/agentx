# ============================================
# Backend CI/CD 工作流配置文件
# ============================================
# 本文件定义了后端代码的持续集成和持续部署流程。
# 
# 主要功能：
# 1. Lint（代码检查）：检查代码风格、类型正确性和安全性
# 2. Test（测试）：运行单元测试并上传覆盖率报告
# 3. Build（构建）：将代码打包为 Docker 镜像并上传
# 
# 触发条件：
# - 推送代码到 main 或 develop 分支，且修改了 backend/ 目录
# - 创建或更新 PR 到 main 分支，且修改了 backend/ 目录
# 
# 执行顺序：lint -> test -> build（前一个成功后才执行下一个）
# ============================================
name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ruff mypy bandit
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

      - name: Mypy type check
        run: mypy app/ --config-file pyproject.toml

      - name: Bandit security scan
        run: bandit -r app/ -c pyproject.toml

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: agentx_test
          POSTGRES_USER: agentx
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://agentx:test_password@localhost:5432/agentx_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only-not-production
          ENVIRONMENT: ci
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: backend/coverage.xml
          flags: backend

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentx-backend:${{ github.sha }} .

      - name: Docker save
        run: docker save agentx-backend:${{ github.sha }} | gzip > agentx-backend.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: backend/agentx-backend.tar.gz