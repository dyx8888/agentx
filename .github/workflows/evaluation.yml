# ============================================
# Agent Evaluation Pipeline 工作流配置文件
# ============================================
# 本文件定义了 Agent 能力评估的自动化流程。
# 
# 主要功能：
# 1. Evaluation（评估）：运行单元测试、Agent 能力评估、根因分析、回归检查
# 2. Lint（代码检查）：检查代码风格和类型正确性
# 
# 触发条件：
# - 推送代码到 main 或 develop 分支，且修改了 backend/ 或 tests/ 目录
# - 创建或更新 PR 到 main 分支，且修改了 backend/ 或 tests/ 目录
# 
# 特色功能：
# - 失败时自动生成根因分析报告
# - 对比历史基线检测性能退化
# - 无论成功失败都上传评估报告
# ============================================
name: Agent Evaluation Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/**'

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENT_EVAL_API_KEY: ${{ secrets.AGENT_EVAL_API_KEY }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=backend/app --cov-report=xml --junitxml=tests/unit-results.xml

      - name: Validate evaluation cases
        run: |
          python -m tests.evaluation.runner --validate-cases

      - name: Run live evaluation
        if: env.AGENT_EVAL_API_KEY != ''
        env:
          AGENT_EVAL_BASE_URL: ${{ vars.AGENT_EVAL_BASE_URL }}
          AGENT_EVAL_MODEL_NAME: ${{ vars.AGENT_EVAL_MODEL_NAME }}
          MODEL_GATEWAY_DEFAULT: eval_proxy
          AGENT_EVAL_MODE: "true"
        run: |
          python -m tests.evaluation.runner --ci

      - name: Explain skipped live evaluation
        if: env.AGENT_EVAL_API_KEY == ''
        run: echo "Live evaluation skipped because AGENT_EVAL_API_KEY is not configured."

      - name: Generate root cause analysis
        if: failure() && env.AGENT_EVAL_API_KEY != ''
        env:
          AGENT_EVAL_BASE_URL: ${{ vars.AGENT_EVAL_BASE_URL }}
          AGENT_EVAL_MODEL_NAME: ${{ vars.AGENT_EVAL_MODEL_NAME }}
          MODEL_GATEWAY_DEFAULT: eval_proxy
          AGENT_EVAL_MODE: "true"
        run: |
          python -m tests.evaluation.runner --root-cause

      - name: Check regression
        run: |
          python -c "
          from tests.evaluation.calibration import RegressionTester
          import json
          tester = RegressionTester()
          baseline = tester.load_baseline()
          if baseline:
              print(f'Baseline: {baseline[\"timestamp\"]}')
          "

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            reports/evaluation/
            tests/unit-results.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- 'backend/*.py' 'backend/**/*.py' 'tests/*.py' 'tests/**/*.py')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed backend/tests Python files; skipping Ruff lint."
          else
            ruff check "${changed[@]}"
          fi
      - name: Type check
        run: |
          pip install pyright
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- 'backend/app/*.py' 'backend/app/**/*.py')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed backend/tests Python files; skipping Pyright."
          else
            pyright --ignoreexternal "${changed[@]}"
          fi
